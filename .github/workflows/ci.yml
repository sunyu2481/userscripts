name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要后续提交回 dist，所以要完整历史
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 递增所有脚本版本号并构建
      - name: Bump and build all scripts
        run: |
          node build.js --bump
          node build.js

      # 跑全部测试
      - name: Run tests
        run: node test.js

      # 把版本号改动 + dist 产物提交回 main。
      # 用 [skip ci] 避免这次提交再触发 workflow，防止死循环。
      - name: Commit updated dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有需要提交的改动"
          else
            git commit -m "chore: 自动构建 dist [skip ci]"
            git push
            echo "已提交并推送 dist"
          fi