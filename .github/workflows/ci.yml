name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 用仓库里的源码重新构建，产物写进临时目录
      - name: Build all scripts
        run: |
          node build.js
          cp -r dist /tmp/dist-fresh

      # 对比本次构建产物与提交里带进来的 dist/
      # 若不一致，说明有人直接改了 dist 或漏跑 build，必须拦下
      - name: Verify dist is up to date
        run: |
          if ! diff -r /tmp/dist-fresh dist >/dev/null; then
            echo "❌ dist/ 与源码不一致。请先运行: node build.js 再提交。"
            echo "差异如下："
            diff -r /tmp/dist-fresh dist || true
            exit 1
          fi
          echo "✅ dist/ 与源码一致"

      # 跑全部测试
      - name: Run tests
        run: node test.js